# 部位与密度等价表 —— 金标准归并与模型输出比对**共用的唯一真源**。
#
# 为什么只留这一份：金标准写「右下肺」、厂商模型回「右肺下叶」，指的是同一处
# 病灶。两边各写一张表，一旦两边漂移，同一处病灶就会被判成「部位不一致」，
# 一次命中被算成漏诊 —— 敏感度直接被拉低，而且从报告上看不出来。
#
# 表以**数据**形式落在这里：新增别名只改这一个文件，**不改判定逻辑代码**
# （判定层只认 canonical 里的标准标签，别名一律先归一）。
#
# 写法约定：
#   1. 别名的值可以直接是标准标签（简写）；
#   2. 也可以写成 {canonical, segment, segment_code} —— 肺段归入所属肺叶时
#      保留「原文写的是哪个肺段」，事后核对时说得清是怎么归的；
#   3. 别名在载入时统一做键归一（NFKC 全角转半角 → 去空白与连字符 → 字母小写），
#      所以「右肺上叶」「右肺 上叶」「右肺上叶。」认作同一个；
#      两个别名归一后撞键会在**载入时报错**，不会静默取一个。
#
# 侧别与肺叶的口径：右肺三叶（左肺两叶，没有中叶）—— 写成「左肺中叶」这种
# 不存在的解剖结构时，等价表**认不出来**（返回空），交人工复核，不替医生编一个。

locations:
  # 标准标签（判定层只认这些）。末三个是「未指定侧别」的写法。
  canonical:
    - 右肺上叶
    - 右肺中叶
    - 右肺下叶
    - 左肺上叶
    - 左肺下叶
    - 右肺
    - 左肺
    - 双肺
    - 上叶
    - 中叶
    - 下叶

